# protocols/layerzero.yaml
#
# Human-authored, single-source protocol config for ARGUS.
#
# This file is the authoritative description of a monitored protocol. The loader
# (protocols/load_protocol.py) emits two downstream artifacts from it:
#   (a) the scope.json-shaped structure ingestion/scope_loader.py consumes, and
#   (b) the splunk/lookups/protocol_config.csv key,value rows the dashboard lookup expects.
#
# Swapping which YAML the pipeline reads (PROTOCOL=<name>) re-points the whole
# scan/detection/dashboard layer at a different protocol.
#
# NOTE: the `display` block below is CURATED metadata, not derived from the
# contract list. `contracts_in_scope` (24) intentionally differs from the number
# of raw contract entries (~45) — the contract list includes multiple
# chain-variants / router/validator infra that the scope-doc Funds count rolls up.
# Keep these explicit so dashboard parity is preserved.

protocol_name: layerzero          # short key, used for file naming / PROTOCOL env
program: "Immunefi LayerZero"     # -> scope.json "program"

# ----------------------------------------------------------------------------
# display / dashboard metadata  ->  splunk/lookups/protocol_config.csv
# These are emitted verbatim as `key,value` rows, in this order.
# ----------------------------------------------------------------------------
display:
  protocol_name: LayerZero
  protocol_full_name: LayerZero Protocol
  protocol_tagline: cross-chain protocol
  total_var_display: $21.95B
  total_var_usd: 21950000000
  contracts_in_scope: 24
  audit_count: 112
  audit_chunk_count: 1290
  source_files_count: 197
  immunefi_program_url: https://immunefi.com/bug-bounty/layerzero/
  max_bounty_critical: 15000000
  max_bounty_high: 250000

# ----------------------------------------------------------------------------
# ingestion source/audit roots (consumed via env by the ingest scripts)
#   source_roots -> ingest_source.py SOURCE_ROOTS (colon-separated)
#   audit_path   -> ingest_audit_findings.py AUDIT_TEXT_DIR (env-hooked)
# Paths may use ~ for the user's home directory.
# ----------------------------------------------------------------------------
source_roots:
  - ~/Desktop/omni-guard/layerzero-src/LayerZero
  - ~/Desktop/omni-guard/layerzero-src/LayerZero-v2
  - ~/Desktop/omni-guard/layerzero-src/solidity-examples
audit_path: ~/Desktop/omni-guard/agent/audit_text

# ----------------------------------------------------------------------------
# contract scope  ->  scope.json "contracts"
#   name    -> contract name
#   address -> on-chain address (lowercased by scope_loader on read)
#   chain   -> chain_hint
# ----------------------------------------------------------------------------
