## kvstore collections used by Argus (app id: omni_guard)

[contract_baselines]
enforceTypes = true
field.contract_name = string
field.chain = string
field.mean_value_eth = number
field.stdev_value_eth = number
field.p99_value_eth = number
field.mean_gas = number
field.stdev_gas = number
field.tx_count_30d = number
field.failed_pct = number
field.dc_senders_30d = number
field.last_updated_epoch = number
accelerated_fields.idx_contract = {"contract_name": 1}

[argus_agent_state]
## Idempotent working state for the in-app agent — one row per finding signature.
enforceTypes = true
field.signature = string
field.primary_tx = string
field.alert_type = string
field.severity = string
field.chain = string
field.verdict = string
field.confidence = number
field.poc_worthwhile = string
field.triaged_epoch = number
accelerated_fields.idx_sig = {"signature": 1}
