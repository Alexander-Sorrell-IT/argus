[Argus_Chain_Activity]
# Acceleration OFF by default: on a single-instance dev box the summary doesn't build cleanly
# and floods splunkd.log with warnings. The model is fully usable via `| datamodel ...` and
# `| tstats ... from datamodel=Argus_Chain_Activity` (against raw). Set acceleration=1 on a
# properly-resourced instance to materialize tstats summaries.
acceleration = 0
acceleration.earliest_time = -90d
acceleration.backfill_time = -90d
acceleration.max_concurrent = 2
