[omni_guard_security]
homePath   = $SPLUNK_DB/omni_guard_security/db
coldPath   = $SPLUNK_DB/omni_guard_security/colddb
thawedPath = $SPLUNK_DB/omni_guard_security/thaweddb
maxDataSize = auto_high_volume
frozenTimePeriodInSecs = 7776000

# Risk index for the ES-ready Risk-Based Alerting search ([Argus - Risk-Based Alerting]).
# Holds CIM risk events (risk_object / risk_score / threat_object) that Splunk Enterprise
# Security's RBA framework consumes. (Standard ES index name is `risk`.)
[risk]
homePath   = $SPLUNK_DB/risk/db
coldPath   = $SPLUNK_DB/risk/colddb
thawedPath = $SPLUNK_DB/risk/thaweddb
frozenTimePeriodInSecs = 7776000
