## ──────────────────────────────────────────────────────────────────────
##  Argus — SPL-native anomaly detection
## ──────────────────────────────────────────────────────────────────────
## All searches lean on Splunk's built-in pattern primitives
## (anomalydetection, cluster, outlier, streamstats, predict, transaction)
## with data-driven per-contract baselines plus conservative fixed floors
## (e.g. value_eth>0.1, zscore>3, fails_10m>5) to suppress dust/noise.
## Splunk does the pattern work; the AI agent only investigates what fires.

# ─── 1. Per-contract value-transfer outliers ─────────────────────────
# Per-contract z-score baseline: eventstats computes mean+stdev per
# contract, we flag values >3 stdev above mean. Auto-tunes per contract,
# with conservative fixed floors (zscore>3, value_eth>0.1) to suppress
# dust/noise. Writes results directly via `collect` since
# Splunk's modular log_event alert action hits HTTP 400 on this install.
[Argus - Value Transfer Outlier]
search = index=omni_guard_security sourcetype=layerzero:transaction value_eth>0 \
    | eventstats avg(value_eth) as mean_v, stdev(value_eth) as std_v, count as n_v by contract_name \
    | where n_v >= 30 AND std_v > 0 \
    | eval zscore=(value_eth - mean_v) / std_v \
    | where zscore > 3 AND value_eth > 0.1 \
    | eval severity=case(zscore>10, "CRITICAL", zscore>5, "HIGH", true(), "MEDIUM") \
    | eval native_price=case(chain=="ethereum",2400, chain=="polygon",0.5, chain=="avalanche",35, chain=="bnb",600, chain=="bsc",600, true(),null()) \
    | eval native_value_usd_est=if(isnull(native_price), null(), round(value_eth*native_price,2)) \
    | eval alert_type="large_value_transfer" \
    | eval description="Value outlier on ".contract_name." (".chain."): ".round(value_eth,4)." ETH (z=".round(zscore,1).", baseline ".round(mean_v,4)." ± ".round(std_v,4).")" \
    | table _time, tx_hash, from_address, contract_name, contract_address, chain, value_eth, zscore, mean_v, native_value_usd_est, severity, alert_type, description, block_number \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 4
alert.suppress = 0
alert.track = 1

# ─── 2. Sender-behavior outliers (catches stealth attackers) ─────────
# Uses outlier on per-sender rolling tx counts. Catches senders whose
# behavior deviates from THEIR OWN baseline — no global threshold needed.
[Argus - Sender Behavior Outlier]
search = index=omni_guard_security sourcetype=layerzero:transaction \
    | bin _time span=10m \
    | stats count as tx_count, sum(value_eth) as eth_moved, dc(contract_name) as contracts_touched by from_address, _time, chain \
    | eventstats avg(tx_count) as avg_tx, stdev(tx_count) as std_tx, count as windows by from_address \
    | where windows >= 5 AND std_tx > 0 \
    | eval z_tx=(tx_count - avg_tx) / std_tx \
    | where (z_tx > 3 AND tx_count >= 5) OR contracts_touched >= 4 \
    | eval severity=if(eth_moved>10 OR contracts_touched>=5, "HIGH", "MEDIUM") \
    | eval alert_type="sender_behavior_outlier" \
    | eval description=from_address." behavior spike: ".tx_count." tx (z=".round(z_tx,1)."), ".round(eth_moved,2)." ETH, ".contracts_touched." contracts in 10m" \
    | table _time, from_address, chain, tx_count, z_tx, eth_moved, contracts_touched, severity, alert_type, description \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = */30 * * * *
enableSched = 1
alert.severity = 3

# ─── 4. Cluster-based pattern discovery (NEW) ────────────────────────
# Groups similar transactions by call pattern. Rare clusters = unusual
# behavior worth investigating. Doesn't rely on any threshold —
# Splunk decides what's similar.
[Argus - Rare Transaction Pattern Cluster]
search = index=omni_guard_security sourcetype=layerzero:transaction method_id!="" \
    | eval pattern_key=method_id."|".contract_name."|".if(value_eth>0,"with_value","no_value") \
    | cluster field=pattern_key showcount=true t=0.8 \
    | stats count as occurrences, values(method_id) as methods, values(from_address) as senders, \
            min(_time) as first_seen by cluster_count, contract_name, chain \
    | where occurrences <= 3 AND first_seen > relative_time(now(), "-7d") \
    | eval severity="MEDIUM" \
    | eval description="Rare call pattern on ".contract_name.": ".methods." (".occurrences." occurrences)" \
    | table first_seen, contract_name, chain, methods, senders, occurrences, severity, description
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 */4 * * *
enableSched = 1
alert.severity = 3

# ─── 5. Cross-contract correlation (NEW) ─────────────────────────────
# Find senders that touched 3+ in-scope contracts within a 30-min window.
# Real attacks often span multiple contracts; benign users rarely do.
[Argus - Cross-Contract Sender Correlation]
search = index=omni_guard_security sourcetype=layerzero:transaction \
    | bin _time span=30m \
    | stats dc(contract_name) as contracts, values(contract_name) as contract_list, \
            sum(value_eth) as total_eth, count as tx_count by from_address, _time \
    | where contracts >= 3 \
    | eval severity=if(contracts>=5 OR total_eth>10, "HIGH", "MEDIUM") \
    | eval alert_type="cross_contract_correlation" \
    | eval description=from_address." touched ".contracts." contracts in 30m: ".mvjoin(contract_list,", ") \
    | table _time, from_address, contracts, contract_list, tx_count, total_eth, severity, alert_type, description \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -6h
dispatch.latest_time = now
cron_schedule = */30 * * * *
enableSched = 1
alert.severity = 3

# ─── 6. Failed-tx burst (refined w/ streamstats baseline) ────────────
# Compares current 10m failed-tx rate to the rolling ~3h baseline for
# the same contract. Burst = current >> baseline, not absolute count.
[Argus - Failed Transaction Burst vs Baseline]
search = index=omni_guard_security sourcetype=layerzero:transaction is_error=true \
    | bin _time span=10m \
    | stats count as fails_10m by contract_name, chain, _time \
    | streamstats current=f window=18 avg(fails_10m) as baseline_avg, stdev(fails_10m) as baseline_std \
        by contract_name \
    | where fails_10m > baseline_avg + (2*baseline_std) AND fails_10m > 5 \
    | eval severity=if(fails_10m > baseline_avg+(4*baseline_std), "HIGH", "MEDIUM") \
    | eval alert_type="failed_tx_burst" \
    | eval description=fails_10m." failed tx on ".contract_name." (".round(baseline_avg,1)." baseline; ".round(baseline_std,1)." stdev)" \
    | table _time, contract_name, chain, fails_10m, baseline_avg, baseline_std, severity, alert_type, description \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -3h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
alert.severity = 3

# ─── 7. Tx volume forecast deviation (NEW — uses `predict`) ──────────
# Splunk's built-in time series forecasting. Computes hourly tx volume
# per top-5 contract, fits LL model on history, fires when actual hour
# is outside 95% prediction interval.
[Argus - Tx Volume Forecast Deviation]
search = index=omni_guard_security sourcetype=layerzero:transaction \
    | timechart span=1h count \
    | predict count algorithm=LL future_timespan=0 lower95=lo upper95=up \
    | rename "lo(prediction(count))" as lo, "up(prediction(count))" as up \
    | eval anomaly=if(count<lo OR count>up, 1, 0) \
    | where anomaly=1 \
    | eval severity="MEDIUM" \
    | eval contract_name="ALL (aggregate hourly volume)" \
    | eval alert_type="tx_volume_forecast_dev" \
    | eval description="Hourly tx volume outside forecast: actual=".count." expected ".round(lo,0)."-".round(up,0) \
    | table _time, contract_name, count, lo, up, severity, alert_type, description
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 */2 * * *
enableSched = 1
alert.severity = 3

# ─── 8. Known-bad address hit (lookup-based enrichment, NEW) ─────────
# Joins every tx against a local lookup of known-malicious addresses.
# Any match = immediate flag. Lookup is bug_bad_addresses.csv, refresh
# weekly from chainabuse / etherscan tags.
[Argus - Known-Bad Address Touched]
search = index=omni_guard_security sourcetype=layerzero:transaction \
    | lookup bad_addresses address as from_address OUTPUT label as bad_label, source as bad_source \
    | where isnotnull(bad_label) \
    | eval severity="CRITICAL" \
    | eval alert_type="known_bad_address" \
    | eval description="Known-bad sender ".from_address." (".bad_label.") interacted with ".contract_name \
    | table _time, tx_hash, from_address, contract_name, contract_address, chain, bad_label, bad_source, severity, alert_type, description, block_number \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 5

# ─── 9. Attack-sequence reconstruction (`transaction` command, NEW) ──
# Groups events from the same sender across a 30-min window into a single
# "attack session" — useful when the exploit unfolds across multiple txns.
[Argus - Multi-Step Attack Sequence]
search = index=omni_guard_security sourcetype=layerzero:transaction \
    | transaction from_address maxspan=30m maxpause=10m \
    | where eventcount >= 5 AND duration < 600 \
    | eval dc_contract_name=mvcount(mvdedup(contract_name)) \
    | eval severity=if(eventcount>=10 OR dc_contract_name>=3, "HIGH", "MEDIUM") \
    | eval alert_type="multi_step_attack_sequence" \
    | eval description=from_address." executed ".eventcount." txn session in ".duration."s across ".dc_contract_name." contracts" \
    | table _time, from_address, eventcount, duration, dc_contract_name, severity, alert_type, description \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -3h
dispatch.latest_time = now
cron_schedule = */30 * * * *
enableSched = 1
alert.severity = 3

# ─── 9b. Nightly baseline builder ────────────────────────────────────
# Rebuilds the contract_baselines kvstore once a day. Detection searches
# can then lookup the baseline instead of recomputing eventstats every
# run — ~10x faster on large history.
[Argus - Build Contract Baselines]
search = index=omni_guard_security sourcetype=layerzero:transaction earliest=-30d \
    | eval is_err=if(is_error=="true" OR is_error==true, 1, 0) \
    | stats avg(value_eth) as mean_value_eth, \
            stdev(value_eth) as stdev_value_eth, \
            p99(value_eth) as p99_value_eth, \
            avg(gas_used) as mean_gas, \
            stdev(gas_used) as stdev_gas, \
            count as tx_count_30d, \
            avg(is_err) as failed_pct, \
            dc(from_address) as dc_senders_30d \
            by contract_name, chain \
    | eval last_updated_epoch=now() \
    | eval _key=contract_name \
    | outputlookup contract_baselines
dispatch.earliest_time = -30d
dispatch.latest_time = now
cron_schedule = 0 4 * * *
enableSched = 1
alert.severity = 2

# ─── 1b. Value outlier (FAST, uses kvstore baseline) ─────────────────
# Same as #1 but reads the pre-computed baseline from the kvstore instead
# of recomputing eventstats. Use this once baselines have been built once.
[Argus - Value Outlier Fast]
search = index=omni_guard_security sourcetype=layerzero:transaction value_eth>0 \
    | lookup contract_baselines contract_name OUTPUT mean_value_eth, stdev_value_eth, tx_count_30d \
    | where isnotnull(mean_value_eth) AND tx_count_30d >= 30 AND stdev_value_eth > 0 \
    | eval zscore=(value_eth - mean_value_eth) / stdev_value_eth \
    | where zscore > 3 AND value_eth > 0.1 \
    | eval severity=case(zscore>10, "CRITICAL", zscore>5, "HIGH", true(), "MEDIUM") \
    | eval description="Value outlier on ".contract_name.": ".round(value_eth,4)." ETH (z=".round(zscore,1)." vs baseline ".round(mean_value_eth,4).")" \
    | table _time, tx_hash, from_address, contract_name, chain, value_eth, zscore, severity, description
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
alert.severity = 4

# ─── 9c. Candidate Scoring — combine signal sources into ONE rank ─
# Ranks alerts by severity + signal breadth (distinct detection types) +
# repeat-offender count, outputs a single "investigate_score". Excludes
# the invalid replay_attack class — an earlier "Replay / Duplicate Message ID"
# rule was REMOVED (it flagged ordinary LayerZero message delivery as false
# positives); this filter drops any stale replay_attack alerts so they cannot
# dominate the ranking. The top N are what a human/SAIA looks at. (Audit-cross-
# ref was also removed: audit_finding has no contract_name key, so that join was
# always dead — see bug-hunt #9.)
[Argus - Candidate Scoring]
search = index=omni_guard_security sourcetype=layerzero:alert alert_type!="replay_attack" \
    | eval sev_score=case(severity="CRITICAL",40, severity="HIGH",25, severity="MEDIUM",10, true(),5) \
    | stats max(sev_score) as sev_score, count as detection_count, values(severity) as severities, \
            values(description) as descriptions, dc(alert_type) as distinct_detections \
            by contract_name, chain \
    | eval signal_breadth_score=if(distinct_detections>=3, 30, distinct_detections*10) \
    | eval repeat_offender_score=if(detection_count>=5, 20, detection_count*4) \
    | eval investigate_score=sev_score + signal_breadth_score + repeat_offender_score \
    | sort -investigate_score \
    | table investigate_score, contract_name, chain, detection_count, distinct_detections, severities, descriptions \
    | head 50
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 3

# ─── 9d. Source-code risk pattern scanner ────────────────────────────
# Scans the indexed layerzero:source corpus for risky Solidity patterns.
# Per-contract risk score = count of pattern hits. Top contracts surface
# to the dashboard for human review.
[Argus - Source Risk Pattern Scan]
search = index=omni_guard_security sourcetype=layerzero:source \
    | eval has_delegatecall=if(match(source_code,"delegatecall\("), 1, 0) \
    | eval has_lowlevel_call=if(match(source_code,"\.call\{value") OR match(source_code,"\.call\("), 1, 0) \
    | eval has_tx_origin=if(match(source_code,"tx\.origin"), 1, 0) \
    | eval has_unchecked=if(match(source_code,"unchecked\s*\{"), 1, 0) \
    | eval has_assembly=if(match(source_code,"assembly\s*\{"), 1, 0) \
    | eval has_selfdestruct=if(match(source_code,"selfdestruct\("), 1, 0) \
    | eval has_ecrecover=if(match(source_code,"ecrecover\("), 1, 0) \
    | eval risk_score=(has_delegatecall*5 + has_lowlevel_call*3 + has_tx_origin*5 \
                       + has_unchecked*1 + has_assembly*2 + has_selfdestruct*5 \
                       + has_ecrecover*2) \
    | where risk_score >= 3 \
    | sort -risk_score \
    | table risk_score, rel_path, file_name, contracts, has_delegatecall, has_lowlevel_call, \
            has_tx_origin, has_unchecked, has_assembly, has_selfdestruct, has_ecrecover
dispatch.earliest_time = -365d
dispatch.latest_time = now
cron_schedule = 0 5 * * *
enableSched = 1
alert.severity = 2

# ─── 9e. Sender behavior clustering (MLTK / AI Toolkit) ──────────────
# Uses Splunk AI Toolkit's `fit DBSCAN` to cluster sender behavior.
# Clusters with very few members but high activity intensity = candidates.
[Argus - Sender Behavior Clustering]
search = index=omni_guard_security sourcetype=layerzero:transaction earliest=-30d \
    | stats count as tx_count, sum(value_eth) as total_eth, dc(contract_name) as contracts_touched, \
            avg(gas_used) as avg_gas, sum(eval(if(is_error="true",1,0))) as fail_count \
            by from_address \
    | where tx_count >= 5 \
    | fit StandardScaler tx_count total_eth contracts_touched avg_gas fail_count \
    | fit DBSCAN eps=0.5 min_samples=3 SS_tx_count SS_total_eth SS_contracts_touched SS_avg_gas SS_fail_count \
    | where cluster=-1 \
    | eval cluster_label=if(cluster=-1, "OUTLIER (noise)", "cluster_".cluster) \
    | sort -tx_count \
    | table from_address, cluster_label, tx_count, total_eth, contracts_touched, avg_gas, fail_count
dispatch.earliest_time = -30d
dispatch.latest_time = now
cron_schedule = 0 6 * * 0
# DISABLED: the only non-pure-SPL detection — it needs the Splunk ML Toolkit
# (fit DBSCAN/StandardScaler), which is not a bundled dependency, so it errored
# on every run. Install MLTK + Python for Scientific Computing to enable, or rely
# on the pure-SPL per-sender behavioral z-score detection (#2) above.
enableSched = 0
alert.severity = 3

# ─── 10. VaR rollup (unchanged, info-only) ───────────────────────────
[Argus - VaR Exposure Summary]
search = index=omni_guard_security sourcetype=layerzero:transaction \
    | stats sum(value_eth) as total_eth_moved, count as tx_count by contract_name, chain \
    | eval total_usd=total_eth_moved*2400 \
    | sort -total_usd \
    | eval var_pct=round((total_usd/21950000000)*100, 4) \
    | table contract_name, chain, tx_count, total_eth_moved, total_usd, var_pct
# NOTE 2026-05-29: "VaR" here is native-asset (ETH) gross transfer throughput only —
# ERC-20/stablecoin flows carry no native value_eth and are counted as $0, so this
# UNDERSTATES true exposure and is not a statistical Value-at-Risk. Treat as a
# native-value throughput rollup pending token-price enrichment.
dispatch.earliest_time = -7d
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1

# ─── 11. Token-transfer outlier (covers ERC-20/OFT/stablecoin contracts) ──────
# value_eth is NATIVE value only and is 0 for token contracts, so the value-
# outlier searches above are blind to USDe/sUSDe/LBTC/ezETH/weETH/BTC.b drains.
# This decodes the ERC-20 Transfer event's `data` (uint256 amount) and z-scores
# the per-contract amount in LOG-MAGNITUDE space. tonumber() dies above ~2^63, so
# we decode only the top 13 significant hex digits as a mantissa plus an exponent
# (significant-hex-digit count), reconstruct the token amount via 10^(log10_raw-
# decimals) — which fits a double once divided by decimals — then LINEAR z-score it
# per contract (same sharp whale-detection as the value searches; decimals cancel
# out of a per-contract z-score, so they only affect the displayed amount).
[Argus - Token Transfer Outlier]
search = index=omni_guard_security sourcetype=layerzero:event topic0="0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef" data="0x*" \
    | eval stripped=ltrim(substr(data,3),"0") \
    | where stripped!="" \
    | eval sd=len(stripped) \
    | eval lead=tonumber(substr(stripped,1,13),16) \
    | where isnotnull(lead) AND lead>0 \
    | eval log10_raw=log(lead,10) + (sd - if(sd>13,13,sd))*1.20411998 \
    | eval decimals=case(match(contract_name,"(?i)lbtc|btc\.b"),8, true(),18) \
    | eval token_amount=pow(10, log10_raw - decimals) \
    | eventstats avg(token_amount) as mean_a, stdev(token_amount) as std_a, count as n_a by contract_name \
    | where n_a>=30 AND std_a>0 \
    | eval zscore=(token_amount-mean_a)/std_a \
    | where zscore>5 \
    | eval severity=case(zscore>12,"CRITICAL", zscore>8,"HIGH", true(),"MEDIUM") \
    | eval alert_type="token_transfer_outlier" \
    | eval description="Token transfer outlier on ".contract_name.": ~".round(token_amount,4)." tokens (z=".round(zscore,1).")" \
    | table _time, tx_hash, contract_name, contract_address, chain, token_amount, zscore, severity, alert_type, description \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */20 * * * *
enableSched = 1
alert.severity = 4

# ─── 12. Mechanism-aware: privileged / admin function call ────────────────────
# The statistical detections above flag anomalous *amounts*; this one flags an
# anomalous *action*. It matches each tx's method_id against a lookup of sensitive
# 4-byte selectors — ownership transfer, proxy upgrade, role grant/revoke, LayerZero
# config (setPeer / setDelegate / setTrustedRemote), pause, and the TempleDAO
# migrateStake selector. This is the access-control / config-tamper class that
# gas-normal, value-normal exploits (e.g. TempleDAO) hide in, which no z-score would
# ever catch. Any privileged call on a monitored contract is worth a human/agent
# look; fork-validation then proves whether it actually drained value. (Benign on
# the bundled ERC-20 sample — by design, it fires on actions, not noise.)
[Argus - Privileged Function Call]
search = index=omni_guard_security sourcetype=layerzero:transaction method_id!="" \
    | lookup privileged_selectors method_id OUTPUT function as priv_function, risk_class as priv_risk \
    | where isnotnull(priv_function) \
    | eval severity=case(priv_risk IN ("ownership","upgrade","access_control","privileged_migrate"),"HIGH", true(),"MEDIUM") \
    | eval alert_type="privileged_function_call" \
    | eval description="Privileged call ".priv_function." (".priv_risk.") on ".contract_name." (".chain.") by ".from_address \
    | table _time, tx_hash, from_address, to_address, contract_name, contract_address, chain, method_id, priv_function, priv_risk, severity, alert_type, description, block_number \
    | collect index=omni_guard_security sourcetype=layerzero:alert
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
alert.severity = 5

# ─── RBA. Risk-Based Alerting (Splunk Enterprise Security-ready) ──────────────
# Emits CIM-compliant risk events into the `risk` index — the exact schema ES's
# Risk-Based Alerting framework consumes (risk_object, risk_score, threat_object).
# The native, ES-ready replacement for hand-rolled per-entity scoring, so Argus
# "drops into Enterprise Security" with no rework. (ES is not bundled — install it
# to get notables / risk-incident rules on top of these risk events.)
[Argus - Risk-Based Alerting (ES-ready)]
search = index=omni_guard_security sourcetype=layerzero:alert \
    | eval risk_object=coalesce(contract_name,"unknown"), risk_object_type="system", \
           threat_object=if(isnotnull(from_address) AND from_address!="", from_address, null()), \
           threat_object_type=if(isnotnull(from_address) AND from_address!="", "user", null()), \
           risk_score=case(severity="CRITICAL",80, severity="HIGH",60, severity="MEDIUM",30, true(),10), \
           risk_message="Argus: ".alert_type." on ".coalesce(contract_name,"?")." (".coalesce(chain,"?").")", \
           source="Argus - Risk-Based Alerting" \
    | table _time, risk_object, risk_object_type, risk_score, threat_object, threat_object_type, risk_message, alert_type, severity, chain, tx_hash, source \
    | collect index=risk sourcetype=stash
# Run ON-DEMAND (not scheduled): a bare `collect` is not idempotent — scheduling it would
# re-collect the same alerts every run and inflate risk_score. Dispatch once over all-time to
# (re)materialize the risk index; for continuous ES feeding, add a dedup key or let ES
# correlation searches read sourcetype=layerzero:alert directly.
dispatch.earliest_time = 0
dispatch.latest_time = now
cron_schedule = */20 * * * *
enableSched = 0
alert.severity = 3

# ─── AR. Adaptive response — notify ops on a CONFIRMED exploit ────────────────
# Fires when fork-validation writes a CONFIRMED verdict and runs a Splunk alert
# action (Log Event by default → a notable-style record; wire action.webhook.param.url
# to page Slack/PagerDuty). This is the operational "so what" of the detect→prove loop.
[Argus - CONFIRMED Exploit - notify ops]
search = index=omni_guard_security sourcetype=layerzero:fork_result status=CONFIRMED \
    | eval message="Argus CONFIRMED exploit: ".coalesce(vulnerability_class,"?")." tx=".coalesce(tx_hash,"?")." (confidence ".coalesce(confidence,"?").")" \
    | table _time, status, vulnerability_class, tx_hash, fork_block, confidence, message
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.track = 1
alert.severity = 5
actions = logevent
action.logevent = 1
action.logevent.param.message = Argus CONFIRMED exploit — $result.message$
